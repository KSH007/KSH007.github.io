<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Similar head content as index.html -->
    <title>Your Business Name - Contact Us</title>
</head>
<body>
    <!-- Header (same as index.html) -->
    
    <!-- Page Title -->
    <section class="page-title">
        <div class="container">
            <h1>Contact Us</h1>
        </div>
    </section>
    
    <!-- Contact Information -->
    <section class="contact-info">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-details">
                    <h2>Get in Touch</h2>
                    <p>We'd love to hear from you. Reach out using any of the methods below or fill out our contact form.</p>
                    
                    <div class="contact-methods">
                        <div class="contact-method">
                            <i class="fas fa-map-marker-alt"></i>
                            <div>
                                <h3>Visit Us</h3>
                                <p>123 Business St, City, Country</p>
                            </div>
                        </div>
                        
                        <div class="contact-method">
                            <i class="fas fa-phone"></i>
                            <div>
                                <h3>Call Us</h3>
                                <p>(123) 456-7890</p>
                            </div>
                        </div>
                        
                        <div class="contact-method">
                            <i class="fas fa-envelope"></i>
                            <div>
                                <h3>Email Us</h3>
                                <p>info@yourbusiness.com</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="contact-form-container">
                    <h2>Send Us a Message</h2>
                    <!-- The form uses a third-party service (FormSpree) to handle submissions -->
                    <form id="contact-form" action="https://formspree.io/f/YOUR_FORMSPREE_ENDPOINT" method="POST">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                        
                        <div class="form-group">
                            <label for="subject">Subject</label>
